<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edu Kit App Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #121212;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #1e1e1e;
      border-bottom: 1px solid #2c2c2c;
      gap: 8px;
    }
    .title {
      font-weight: 700;
      font-size: 15px;
      color: #00e676;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    button {
      background: #00e676;
      color: #000000;
      border: none;
      padding: 8px 11px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    button.secondary {
      background: #2c2c2c;
      color: #ffffff;
    }
    #status {
      font-size: 12px;
      color: #bbbbbb;
      padding: 6px 14px;
      background: #181818;
      border-bottom: 1px solid #252525;
    }
    #menuView {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      align-content: start;
    }
    .app-card {
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }
    .app-name {
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
    }
    .app-meta {
      font-size: 12px;
      color: #9e9e9e;
    }
    #playerView {
      flex: 1;
      display: none;
      width: 100%;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000000;
    }
  </style>
</head>
<body>
  <header>
    <div class="title" id="headerTitle">Edu Kit Apps</div>
    <div class="controls">
      <button class="secondary" id="btnBackMenu" onclick="showMenu()" style="display:none;">All Apps</button>
      <button class="secondary" id="btnReload" onclick="reloadCurrentApp()" style="display:none;">Reload</button>
      <button onclick="claimReward(30)">+30s</button>
    </div>
  </header>

  <div id="status">Status: Scanning apps...</div>

  <div id="menuView"></div>

  <div id="playerView">
    <iframe id="twFrame" src="" allow="autoplay"></iframe>
  </div>

  <script>
    let EDU_APPS = [];
    let currentApp = null;

    const menuView = document.getElementById("menuView");
    const playerView = document.getElementById("playerView");
    const frameEl = document.getElementById("twFrame");
    const statusEl = document.getElementById("status");
    const headerTitle = document.getElementById("headerTitle");
    const btnBackMenu = document.getElementById("btnBackMenu");
    const btnReload = document.getElementById("btnReload");

    function setStatus(msg) {
      statusEl.textContent = "Status: " + msg;
    }

    function renderMenu() {
      menuView.innerHTML = "";
      EDU_APPS.forEach((app) => {
        const card = document.createElement("div");
        card.className = "app-card";

        const info = document.createElement("div");
        const title = document.createElement("div");
        title.className = "app-name";
        title.textContent = app.name;

        const meta = document.createElement("div");
        meta.className = "app-meta";
        meta.textContent = app.rewardHint || "Edu Kit App";

        info.appendChild(title);
        info.appendChild(meta);

        const openBtn = document.createElement("button");
        openBtn.textContent = "Launch";
        openBtn.onclick = () => launchApp(app);

        card.appendChild(info);
        card.appendChild(openBtn);
        menuView.appendChild(card);
      });
    }

    function launchApp(app) {
      currentApp = app;
      headerTitle.textContent = app.name;
      menuView.style.display = "none";
      playerView.style.display = "block";
      btnBackMenu.style.display = "inline-block";
      btnReload.style.display = "inline-block";
      frameEl.src = app.path;
      setStatus("Opened " + app.name);
    }

    function showMenu() {
      currentApp = null;
      frameEl.src = "";
      headerTitle.textContent = "Edu Kit Apps";
      playerView.style.display = "none";
      menuView.style.display = "grid";
      btnBackMenu.style.display = "none";
      btnReload.style.display = "none";
      setStatus("Pick an app (" + EDU_APPS.length + " available)");
    }

    function reloadCurrentApp() {
      if (!currentApp) return;
      frameEl.src = currentApp.path;
      setStatus("Reloaded " + currentApp.name);
    }

    function claimReward(seconds) {
      const amt = Number(seconds) || 0;
      if (amt <= 0) return;

      if (window.EduBridge && typeof window.EduBridge.rewardSeconds === "function") {
        window.EduBridge.rewardSeconds(amt);
        setStatus("Awarded +" + amt + "s to screen time");
      } else {
        setStatus("Browser test mode: +" + amt + "s");
      }
    }

    window.loadEduApps = function (appsList) {
      if (Array.isArray(appsList) && appsList.length > 0) {
        EDU_APPS = appsList;
        renderMenu();
        setStatus("Loaded " + EDU_APPS.length + " apps");
      } else {
        setStatus("No apps found in edu_webapp/apps/");
      }
    };

    window.addEventListener("message", (event) => {
      if (!event.data || typeof event.data !== "object") return;
      if (event.data.type === "EDUKIT_REWARD") {
        claimReward(event.data.seconds);
      }
    });

    window.eduKitReward = claimReward;
  </script>
</body>
</html>
